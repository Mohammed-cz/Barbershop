<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קביעת תור - מספרה</title>
    <!-- קישור לקובץ ה-Manifest של ה-PWA כדי שהלקוח יוכל להתקין את האפליקציה -->
    <link rel="manifest" href="manifest.json">
    <!-- ربط ملف الـ CSS الخارجي -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* تنسيق إضافي لتعطيل الزر في الأيام المغلقة */
        .submit-btn:disabled {
            background-color: #bdc3c7 !important;
            color: #7f8c8d !important;
            cursor: not-allowed !important;
            opacity: 0.7;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>💈 קביעת תור במספרה</h1>
            <p>בחר את התאריך והשעה הנוחים לך</p>
        </header>

        <!-- رسالة الإغلاق الطارئ المحدثة مع الأيقونة والعبارة الجديدة -->
        <div id="shopClosedNotice" style="display: none; background: #f8d7da; color: #721c24; padding: 20px; text-align: center; font-weight: bold; border-radius: 8px; margin: 20px 0;">
            💈 ⛔ סגור כעת. עמכם הסליחה, אנא חזרו במועד אחר 💈
        </div>

        <form id="bookingForm" onsubmit="saveBooking(event)">
            <div class="form-group">
                <label for="clientName">שם מלא:</label>
                <input type="text" id="clientName" required placeholder="הכנס את שמך המלא">
            </div>

            <div class="form-group">
                <label for="clientPhone">מספר טלפון:</label>
                <input type="tel" id="clientPhone" required placeholder="0501234567" maxlength="10">
                <div id="phoneErrorMsg" class="error-msg">⚠️ נא להכניס מספר טלפון תקין בן 10 ספרות (לדוגמה: 0501234567)</div>
            </div>

            <div class="form-group">
                <label for="bookingDate">תאריך התור:</label>
                <input type="date" id="bookingDate" required onchange="onDateSelected()">
            </div>

            <div class="form-group">
                <label for="bookingTime">שעה:</label>
                <!-- قائمة تفاعلية لتحديد الساعات المتاحة بناءً على اليوم المحدد -->
                <select id="bookingTime" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px;">
                    <option value="">בחר תאריך קודם</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">אישור קביעת תור</button>
        </form>

        <div id="successMsg" class="success-msg">התור נקבע בהצלחה! מחכים לביקור שלך.</div>
    </div>

    <!-- كود إخفاء شارة نتليفاي نهائياً -->
    <style>
      iframe[src*="netlify"],
      netlify-connection-indicator,
      .netlify-badge,
      #netlify-badge,
      div[class*="netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const hideNetlify = () => {
          document.querySelectorAll('iframe[src*="netlify"], netlify-connection-indicator, .netlify-badge, [data-netlify-deploy-id]').forEach(el => el.remove());
        };
        hideNetlify();
        setTimeout(hideNetlify, 1000);
      });
    </script>

    <script>
        let globalShopData = null;

        // دالة أرشفة وتنظيف الحجوزات القديمة وتحويلها لإحصائيات
        function archiveOldBookingsAndCleanUp() {
            const today = new Date().toISOString().split('T')[0];
            let bookings = JSON.parse(localStorage.getItem('barberBookings')) || [];
            let stats = JSON.parse(localStorage.getItem('barberStats')) || { daily: {}, monthly: {} };

            let activeBookings = [];

            bookings.forEach(b => {
                if (b.date < today) {
                    const dateKey = b.date;
                    const monthKey = b.date.substring(0, 7);

                    stats.daily[dateKey] = (stats.daily[dateKey] || 0) + 1;
                    stats.monthly[monthKey] = (stats.monthly[monthKey] || 0) + 1;
                } else {
                    activeBookings.push(b);
                }
            });

            localStorage.setItem('barberBookings', JSON.stringify(activeBookings));
            localStorage.setItem('barberStats', JSON.stringify(stats));
        }

        function setMinDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('bookingDate').setAttribute('min', today);
        }

        async function fetchShopDataForClient() {
            try {
                const response = await fetch('https://barbershop-4qit.onrender.com/api/shop-status');
                globalShopData = await response.json();
                const bookingForm = document.getElementById('bookingForm');
                const noticeDiv = document.getElementById('shopClosedNotice');
                
                if (!globalShopData.isOpen) {
                    if (bookingForm) bookingForm.style.display = 'none';
                    if (noticeDiv) noticeDiv.style.display = 'block';
                } else {
                    if (bookingForm) bookingForm.style.display = 'block';
                    if (noticeDiv) noticeDiv.style.display = 'none';
                    onDateSelected();
                }
            } catch (err) {
                console.error('Error fetching shop status', err);
            }
        }

        function onDateSelected() {
            if (!globalShopData || !globalShopData.weeklySchedule) return;

            const dateVal = document.getElementById('bookingDate').value;
            const timeSelect = document.getElementById('bookingTime');
            const submitBtn = document.getElementById('submitBtn');

            if (!dateVal) {
                timeSelect.innerHTML = '<option value="">בחר תאריך קודם</option>';
                timeSelect.disabled = true;
                submitBtn.disabled = true;
                return;
            }

            const selectedDateObj = new Date(dateVal);
            const dayOfWeek = selectedDateObj.getDay();
            const dayConfig = globalShopData.weeklySchedule[dayOfWeek];

            if (!dayConfig || !dayConfig.isOpen) {
                timeSelect.innerHTML = '<option value="">❌ המספרה סגורה ביום זה</option>';
                timeSelect.disabled = true;
                submitBtn.disabled = true;
                return;
            }

            timeSelect.disabled = false;
            submitBtn.disabled = false;
            generateTimeSlots(dayConfig.openTime, dayConfig.closeTime, dateVal);
        }

        function generateTimeSlots(openTimeStr, closeTimeStr, selectedDate) {
            const timeSelect = document.getElementById('bookingTime');
            timeSelect.innerHTML = '<option value="">בחר שעה לתור</option>';

            if (!openTimeStr || !closeTimeStr) {
                openTimeStr = "09:00";
                closeTimeStr = "19:00";
            }

            let bookings = JSON.parse(localStorage.getItem('barberBookings')) || [];
            let bookedTimes = bookings.filter(b => b.date === selectedDate).map(b => b.time);

            const [startHour, startMin] = openTimeStr.split(':').map(Number);
            const [endHour, endMin] = closeTimeStr.split(':').map(Number);

            let currentMinutes = startHour * 60 + startMin;
            const endMinutes = endHour * 60 + endMin;

            while (currentMinutes < endMinutes) {
                const hours = Math.floor(currentMinutes / 60);
                const minutes = currentMinutes % 60;
                
                const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
                
                const option = document.createElement('option');
                option.value = timeString;

                if (bookedTimes.includes(timeString)) {
                    option.textContent = `${timeString} - (תור תפוס)`;
                    option.disabled = true;
                } else {
                    option.textContent = timeString;
                }

                timeSelect.appendChild(option);
                currentMinutes += 30;
            }
        }

        function isValidPhone(phone) {
            const phoneRegex = /^05\d{8}$/;
            return phoneRegex.test(phone.trim());
        }

        function saveBooking(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const phoneInput = document.getElementById('clientPhone').value.trim();
            const phoneErrorMsg = document.getElementById('phoneErrorMsg');

            if (!isValidPhone(phoneInput)) {
                phoneErrorMsg.style.display = 'block';
                document.getElementById('clientPhone').focus();
                return;
            } else {
                phoneErrorMsg.style.display = 'none';
            }

            if (submitBtn.disabled) return;

            let booking = {
                name: document.getElementById('clientName').value,
                phone: phoneInput,
                date: document.getElementById('bookingDate').value,
                time: document.getElementById('bookingTime').value
            };

            let bookings = JSON.parse(localStorage.getItem('barberBookings')) || [];
            bookings.push(booking);
            
            localStorage.setItem('barberBookings', JSON.stringify(bookings));

            document.getElementById('successMsg').style.display = 'block';
            document.getElementById('bookingForm').reset();
            setMinDate();
            onDateSelected();

            setTimeout(() => {
                document.getElementById('successMsg').style.display = 'none';
            }, 4000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            archiveOldBookingsAndCleanUp();
            setMinDate();
            fetchShopDataForClient();
            setInterval(fetchShopDataForClient, 20000);

            document.getElementById('clientPhone').addEventListener('input', function() {
                document.getElementById('phoneErrorMsg').style.display = 'none';
            });
        });
    </script>
</body>
</html>
